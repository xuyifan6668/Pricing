name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-gcc:
    name: Linux / GCC / Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev catch2 nlohmann-json3-dev
      - name: Configure
        run: cmake --preset linux-gcc-release
      - name: Build
        run: cmake --build --preset linux-gcc-release
      - name: Test
        run: ctest --preset linux-gcc-release

  linux-sanitizers:
    name: Linux / GCC / ASan+UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev catch2 nlohmann-json3-dev
      - name: Configure
        run: cmake --preset linux-gcc-san
      - name: Build
        run: cmake --build --preset linux-gcc-san
      - name: Test
        run: ctest --preset linux-gcc-san -j 4
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1

  windows-msvc:
    name: Windows / MSVC / Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Point CMake at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake --preset msvc-release
      - name: Build
        run: cmake --build --preset msvc-release
      - name: Test
        run: ctest --preset msvc-release

  python:
    name: Python / tools and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Tests
        run: |
          uv python install 3.12
          uv run --python 3.12 --with pytest pytest tools/ python/tests/ -q
