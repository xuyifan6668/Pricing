[project]
name = "ratelib"
version = "0.1.0"
description = "USD rates pricing library: validation, reports and plots around the C++ core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "jupyter>=1.1",
  "mypy>=1.11",
]

# Pure Python: validation, reports and plots. The pricing is the C++ library.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/ratelib"]

[tool.pytest.ini_options]
testpaths = ["python/tests", "tools"]
pythonpath = ["python", "tools"]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "jupyter>=1.1",
]
